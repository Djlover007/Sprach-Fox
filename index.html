<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprach Fox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app shell. Header, scrolling main area, bottom navigation. Sheets slide up from the bottom. */
:root{
  --bg:#f7f5f2; --surface:#ffffff; --surface2:#efebe6; --fg:#17130f; --muted:#6f685f; --line:#e6e0d9;
  --accent:#e8640c; --accent-ink:#ffffff; --accent-soft:#fde6d4;
  --green:#14a37f; --green-soft:#d9f2ea; --good:#178a5a; --good-soft:#dcf3e6; --bad:#d0342c; --bad-soft:#fbe3e1;
  --shadow:rgba(40,24,10,.14);
  --font-display:'Bricolage Grotesque','Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
    --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
    --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
    --shadow:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0f;--surface:#18181d;--surface2:#232329;--fg:#f4f4f6;--muted:#a4a4ae;--line:#2b2b32;
  --accent:#ff7a1a;--accent-ink:#1b0c02;--accent-soft:rgba(255,122,26,.16);
  --green:#2cc79c;--green-soft:rgba(44,199,156,.15);--good:#4cd08f;--good-soft:rgba(76,208,143,.14);--bad:#ff6f61;--bad-soft:rgba(255,111,97,.14);
  --shadow:rgba(0,0,0,.55);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--font-body);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Kopf */
.head{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;flex:none}
.logo{width:40px;height:40px;border-radius:12px;background:var(--green);display:grid;place-items:center;flex:none}
.logo svg{width:30px;height:30px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column}
.brand b{font:800 25px/1.05 var(--font-display);letter-spacing:-.02em}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.brand small span{color:var(--accent);font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg)}
.ib:active{background:var(--surface2)}

main{flex:1;min-height:0;overflow-y:auto;padding:6px 16px 24px;-webkit-overflow-scrolling:touch}
.view{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto}
h2{font:700 22px/1.2 var(--font-display);margin:6px 0 0;letter-spacing:-.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:14px;margin:0}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}

/* Bausteine */
.box{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.grn{background:var(--green);color:#fff}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.btn svg.i{width:18px;height:18px}
select,input[type=text],input[type=password],textarea{width:100%;border:0;border-radius:12px;background:var(--surface2);padding:12px 14px;color:var(--fg)}
select{height:46px;padding:0 12px;font-weight:600}
textarea{min-height:84px;resize:none;font-size:18px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{white-space:nowrap;flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip.add{border-style:dashed;color:var(--muted)}

/* Sprechen */
.speak{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 2px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 38%,transparent)}
.mic svg{width:36px;height:36px}
.mic.live{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 22%,transparent)}}
.mic-sm{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mic-sm svg{width:20px;height:20px}
.inrow{display:flex;gap:8px;align-items:flex-end}
.pair{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}

/* Ergebnis-Karten */
.card{background:var(--surface);border-radius:20px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--accent);box-shadow:0 1px 0 var(--line)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tr{font:600 25px/1.3 var(--font-display);overflow-wrap:anywhere}
.tr .w{border-radius:6px;padding:0 1px;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--muted) 60%,transparent);text-underline-offset:5px;text-decoration-thickness:1.5px}
.tr .w:active{background:var(--accent-soft)}
.translit{color:var(--muted);font-style:italic}
.tip{background:var(--surface2);border-radius:14px;padding:11px 13px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.tip b.h{color:var(--accent)}
.words{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:15px}
.score{border-radius:14px;padding:10px 13px;font-size:15px}
.score.ok{background:var(--good-soft);color:var(--fg)}
.score.mid{background:var(--accent-soft)}
.score.no{background:var(--bad-soft)}
.score b{font:800 22px var(--font-display);margin-right:6px}

/* Vokabeln */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:18px;padding:12px 8px;text-align:center}
.stat b{display:block;font:800 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:8px}
.vi{background:var(--surface);border-radius:16px;padding:12px 10px 12px 14px;display:flex;gap:10px;align-items:center}
.vi .tx{flex:1;min-width:0}
.vi .tx b{display:block;font-weight:700;overflow-wrap:anywhere}
.vi .tx small{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.lvl{display:flex;gap:3px;margin-top:6px}
.lvl i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.lvl i.f{background:var(--green)}
.empty{text-align:center;color:var(--muted);padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty svg{width:64px;height:64px}

/* Üben */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px;text-align:center}
.mode small{font-weight:500;color:var(--muted);font-size:12px;line-height:1.25}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode svg.i{width:26px;height:26px;color:var(--accent)}
.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.q{font:700 28px/1.25 var(--font-display);text-align:center;overflow-wrap:anywhere;padding:8px 0}
.qsub{text-align:center;color:var(--muted);font-size:14px}
.res{border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.res.ok{background:var(--good-soft)}
.res.no{background:var(--bad-soft)}
.res .big{font:600 21px/1.3 var(--font-display);overflow-wrap:anywhere}
.zeugnis{background:var(--surface);border-radius:24px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;border:2px solid var(--line)}
.zeugnis .note{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:800 54px/1 var(--font-display);color:#fff;background:var(--green)}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;align-self:flex-start}

/* Lehrer */
.lessons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lesson{border:0;background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.lesson b{font:700 16px/1.2 var(--font-display)}
.lesson small{color:var(--muted);font-size:13px}
.lesson .n{font-size:12px;font-weight:700;color:var(--green)}
.phr{background:var(--surface);border-radius:16px;padding:12px 10px 12px 14px;display:flex;gap:8px;align-items:center}
.phr .tx{flex:1;min-width:0}
.phr .tx b{display:block;font:600 18px/1.3 var(--font-display);overflow-wrap:anywhere}
.phr .tx small{display:block;color:var(--muted);font-size:14px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:6px}
.msg.t{align-self:flex-start;background:var(--surface);border-bottom-left-radius:6px}
.msg .de{font-size:14px;color:var(--muted)}
.fix{font-size:14px;background:var(--bad-soft);border-radius:10px;padding:8px 10px}
.fix s{opacity:.7}

/* Navigation unten */
.bnav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted)}
.bnav button .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.bnav button[aria-current="page"]{color:var(--fg)}
.bnav button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
.bnav .badge{position:absolute;margin:-16px 0 0 24px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* Blatt von unten */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:4px}
.sheet h3{font:700 21px/1.2 var(--font-display);margin:0}
.srow{background:var(--surface);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.srow.line{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.srow small{color:var(--muted);font-size:13.5px}
.sw{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--accent)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:13px 16px;border-radius:14px;font-size:15px;box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg);transition:opacity .45s ease,visibility 0s .45s}
#splash.hide{opacity:0;visibility:hidden}
#splash .sp-logo{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;background:var(--green);box-shadow:0 14px 34px var(--shadow);animation:spPop .6s cubic-bezier(.2,.9,.3,1.3) both}
#splash .sp-logo svg{width:74px;height:74px}
#splash b{font:800 32px/1.1 var(--font-display);letter-spacing:-.02em;margin-top:8px;animation:spUp .5s .15s ease both}
#splash small{font-size:14px;color:var(--muted);letter-spacing:.06em;animation:spUp .5s .3s ease both}
#splash small span{color:var(--accent);font-weight:700}
@keyframes spPop{from{transform:scale(.6);opacity:0}}
@keyframes spUp{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<header class="head">

<script>
'use strict';
/* ================= Grundlagen ================= */
var REPO='__REPO__';
var LANGS={
  de:{n:'Deutsch',t:'de-DE'}, en:{n:'Englisch',t:'en-GB'}, es:{n:'Spanisch',t:'es-ES'}, fr:{n:'Französisch',t:'fr-FR'},
  it:{n:'Italienisch',t:'it-IT'}, pt:{n:'Portugiesisch',t:'pt-PT'}, nl:{n:'Niederländisch',t:'nl-NL'}, pl:{n:'Polnisch',t:'pl-PL'},
  tr:{n:'Türkisch',t:'tr-TR'}, hr:{n:'Kroatisch',t:'hr-HR'}, sr:{n:'Serbisch',t:'sr-RS'}, cs:{n:'Tschechisch',t:'cs-CZ'},
  ro:{n:'Rumänisch',t:'ro-RO'}, hu:{n:'Ungarisch',t:'hu-HU'}, el:{n:'Griechisch',t:'el-GR'}, sq:{n:'Albanisch',t:'sq-AL'},
  sv:{n:'Schwedisch',t:'sv-SE'}, da:{n:'Dänisch',t:'da-DK'}, no:{n:'Norwegisch',t:'nb-NO'}, ru:{n:'Russisch',t:'ru-RU'},
  uk:{n:'Ukrainisch',t:'uk-UA'}, ar:{n:'Arabisch',t:'ar-SA'}, ja:{n:'Japanisch',t:'ja-JP'}, 'zh-CN':{n:'Chinesisch',t:'zh-CN'},
  ko:{n:'Koreanisch',t:'ko-KR'}, th:{n:'Thai',t:'th-TH'}, vi:{n:'Vietnamesisch',t:'vi-VN'}
};
var NOSPACE={ja:1,'zh-CN':1,th:1};
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ln(k){return (LANGS[k]||{n:k}).n;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function ic(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>';}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var DAY=864e5, INTERVALS=[0,1,3,7,16,35];
var set=Object.assign({src:'de',targets:['en','es','it'],rate:0.95,autoSay:true,key:'',autoUpd:true,learn:'en',level:'A1'},load('sf-set',{}));
var vocab=load('sf-vocab',[]);
function saveSet(){save('sf-set',set);}
function saveVocab(){save('sf-vocab',vocab);updateBadge();}

var tT;function toast(m,ms){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on');},ms||3800);}

/* ================= Native Teile ================= */
function isNative(){try{return !!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());}catch(e){return false;}}
function plug(name){
  if(!isNative())return null;
  try{return (Capacitor.Plugins&&Capacitor.Plugins[name])||Capacitor.registerPlugin(name);}catch(e){return null;}
}

/* Vorlesen */
var ttsL=false, ttsStarted={}, ttsWarned=false;
function ttsListen(P){
  if(ttsL)return;ttsL=true;
  try{P.addListener('start',function(e){ttsStarted[e.id]=1;});}catch(x){}
  try{P.addListener('error',function(e){
    ttsStarted[e.id]=1;var c=e&&e.code;
    if(c===-9||c===-5)ttsMissing(null,'Die Stimme wird gerade noch heruntergeladen oder fehlt.');
    else if(c===-6||c===-7)toast('Die Stimme braucht gerade Internet. Prüf deine Verbindung.',5000);
    else ttsHelp('Die Sprachausgabe meldet einen Fehler (Code '+c+'). Tipp auf „Vorlesen testen“ und dort auf „Sprachausgabe neu verbinden“.');
  });}catch(x){}
}
function ttsMissing(lang,why){
  openSheet('<h3>Stimme fehlt</h3><div class="srow"><small style="color:var(--fg)">'+esc(why||('Auf deinem Handy ist noch keine Stimme für '+ln(lang)+' installiert.'))+' Du kannst sie kostenlos nachladen: In den Einstellungen unter Sprachausgabe, Google, Sprachdaten installieren.</small></div>'+
    '<button class="btn pri wide" data-act="ttsinstall">Stimmen herunterladen</button><button class="btn wide" data-act="ttstest">Vorlesen testen</button><button class="btn wide" data-act="close">Später</button>');
}
function ttsHelp(why){
  openSheet('<h3>Kein Ton beim Vorlesen?</h3><div class="srow"><small style="color:var(--fg)">'+esc(why)+'</small></div>'+
    '<button class="btn pri wide" data-act="ttstest">Vorlesen testen</button><button class="btn wide" data-act="close">Schließen</button>');
}
async function say(text,lang,slow){
  if(!text)return;
  var tag=(LANGS[lang]||{t:lang}).t, rate=set.rate*(slow?0.65:1);
  var P=plug('Tts');
  if(P){
    ttsListen(P);
    try{
      var r=await P.speak({text:text,lang:tag,rate:rate});
      if(r&&r.volume===0){toast('Deine Medienlautstärke steht auf 0. Drück die Lauter-Taste am Handy.',5000);return;}
      var id=r&&r.id;
      setTimeout(function(){
        if(id&&!ttsStarted[id]&&!ttsWarned){ttsWarned=true;ttsHelp('Das Handy hat den Satz angenommen, spielt aber nichts ab. Meistens fehlt die Google-Sprachausgabe oder eine Stimme für '+ln(lang)+'.');}
      },4500);
    }catch(e){
      var m=String((e&&e.message)||e);
      if(/missing/.test(m))ttsMissing(lang);
      else if(/^init/.test(m))ttsHelp('Auf deinem Handy ist keine Sprachausgabe eingerichtet. Installiere „Sprachausgabe von Google“ aus dem Play Store und stell sie in den Android-Einstellungen als Standard ein.');
      else ttsHelp('Vorlesen hat nicht geklappt: '+m);
    }
    return;
  }
  if('speechSynthesis' in window){
    try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=tag;u.rate=rate;
      var v=speechSynthesis.getVoices().filter(function(v){return v.lang&&v.lang.slice(0,2).toLowerCase()===tag.slice(0,2).toLowerCase();})[0];if(v)u.voice=v;
      speechSynthesis.speak(u);}catch(e){toast('Vorlesen hat nicht geklappt.');}
  }else toast('Vorlesen wird hier nicht unterstützt.');
}
async function ttsTest(){
  var P=plug('Tts');if(!P){toast('Nur in der App verfügbar.');return;}
  var d={};try{d=await P.diag();}catch(e){}
  var eng=(d.engines||[]), hasGoogle=eng.indexOf('com.google.android.tts')>=0;
  var probs=[];
  if(!d.ready)probs.push(d.initDone?'Die Sprachausgabe startet nicht (Status '+d.initStatus+').':'Die Sprachausgabe startet noch …');
  if(!eng.length)probs.push('Auf dem Handy ist keine Sprachausgabe installiert.');
  else if(!hasGoogle)probs.push('Die Sprachausgabe von Google fehlt. Mit ihr klappt es am zuverlässigsten.');
  if(d.volume===0)probs.push('Die Medienlautstärke steht auf 0.');
  openSheet('<h3>Vorlesen testen</h3>'+
    '<div class="srow"><b>'+(probs.length?'Das habe ich gefunden':'Alles sieht gut aus')+'</b>'+(probs.length?'<ul style="margin:0;padding-left:20px">'+probs.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>':'<small>Tipp auf Probe. Wenn du nichts hörst, ist eine Stimme nicht geladen.</small>')+
    '<small>Sprachausgabe: '+esc(d.engine||'keine')+(d.fileMode?' · Wiedergabe über Datei':'')+' · Lautstärke '+(d.volume!=null?d.volume+' von '+d.maxVolume:'?')+'</small></div>'+
    '<div class="row"><button class="btn pri" style="flex:1" data-act="ttsprobe" data-l="de">'+ic('play')+'Probe Deutsch</button><button class="btn" style="flex:1" data-act="ttsprobe" data-l="en">'+ic('play')+'Probe Englisch</button></div>'+
    (d.volume===0?'<button class="btn wide" data-act="ttslouder">Lauter stellen</button>':'')+
    (!hasGoogle?'<button class="btn wide grn" data-act="ttsgoogle">Sprachausgabe von Google holen</button>':'')+
    '<button class="btn wide" data-act="ttsinstall">Stimmen herunterladen</button>'+
    '<button class="btn wide" data-act="ttssettings">Android-Einstellungen Sprachausgabe</button>'+
    '<button class="btn wide" data-act="ttsrestart">Sprachausgabe neu verbinden</button>');
}

/* Zuhören */
function listen(lang,prompt){
  var tag=(LANGS[lang]||{t:lang}).t;
  var P=plug('Speech');
  if(P){
    return P.listen({lang:tag,prompt:prompt||''}).then(function(r){return (r&&r.matches)||[];});
  }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return Promise.reject(new Error('Spracheingabe gibt es hier nicht. Tipp aufs Mikro deiner Tastatur.'));
  return new Promise(function(res,rej){
    var r=new SR();r.lang=tag;r.maxAlternatives=5;r.interimResults=false;var got=[];
    r.onresult=function(ev){got=[];for(var i=0;i<ev.results[0].length;i++)got.push(ev.results[0][i].transcript);};
    r.onerror=function(ev){rej(new Error(ev.error==='not-allowed'?'Mikrofon ist gesperrt.':'Nichts verstanden.'));};
    r.onend=function(){res(got);};
    try{r.start();}catch(e){rej(e);}
  });
}
function micBusy(btn,on){if(btn)btn.classList.toggle('live',!!on);}

/* ================= Übersetzung ================= */
var tcache=load('sf-tcache',{});
function cacheSave(){var k=Object.keys(tcache);if(k.length>600){k.slice(0,k.length-500).forEach(function(x){delete tcache[x];});}save('sf-tcache',tcache);}
async function fetchT(url,opt,ms){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort();},ms||15000);
  try{return await fetch(url,Object.assign({signal:ctl.signal},opt||{}));}finally{clearTimeout(t);}
}
async function translate(q,sl,tl){
  q=String(q).trim();if(!q)return {text:'',translit:'',src:sl};
  if(sl===tl)return {text:q,translit:'',src:sl};
  var key=sl+'|'+tl+'|'+q;if(tcache[key])return tcache[key];
  var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+encodeURIComponent(sl)+'&tl='+encodeURIComponent(tl)+'&dt=t&dt=rm&q='+encodeURIComponent(q);
  var r=await fetchT(url);
  if(!r.ok)throw new Error('Übersetzung nicht erreichbar ('+r.status+')');
  var j=await r.json(), text='', tr='';
  (j[0]||[]).forEach(function(s){if(s[0]!=null)text+=s[0];else if(s[2])tr+=s[2];});
  var out={text:text.trim(),translit:tr.trim(),src:j[2]||sl};
  if(out.translit&&out.translit.toLowerCase()===out.text.toLowerCase())out.translit='';
  tcache[key]=out;cacheSave();
  return out;
}

/* ================= Claude (Lehrer) ================= */
function hasKey(){return !!(set.key&&set.key.trim());}
async function askClaude(system,messages,maxTokens){
  if(!hasKey())throw {code:'nokey'};
  var r=await fetchT('https://api.anthropic.com/v1/messages',{method:'POST',headers:{
    'content-type':'application/json','x-api-key':set.key.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:maxTokens||900,system:system,messages:messages})},40000);
  if(r.status===401)throw {code:'badkey'};
  if(r.status===429)throw {code:'rate'};
  if(!r.ok){var tx='';try{tx=(await r.json()).error.message;}catch(e){}throw {code:'http',message:'Fehler '+r.status+(tx?': '+tx:'')};}
  var j=await r.json();
  var text=(j.content||[]).map(function(c){return c.text||'';}).join('');
  var m=text.match(/\{[\s\S]*\}/);if(!m)throw {code:'parse'};
  return JSON.parse(m[0]);
}
function claudeErr(e){
  if(e&&e.code==='nokey'){keySheet();return;}
  if(e&&e.code==='badkey'){toast('Der Claude-Schlüssel stimmt nicht. Prüf ihn in den Einstellungen.',5000);return;}
  if(e&&e.code==='rate'){toast('Gerade zu viele Anfragen. Warte kurz.');return;}
  toast((e&&e.message)||'Der Lehrer ist gerade nicht erreichbar. Prüf deine Internetverbindung.',5000);
}
function keySheet(){
  openSheet('<h3>Lehrer freischalten</h3>'+
    '<div class="srow"><small style="color:var(--fg)">Übersetzen, Vorlesen, Vokabeln, Üben und die Lektionen funktionieren ohne Anmeldung. Für den Lehrer, der mit dir spricht, Fehler erklärt und Grammatik-Tipps gibt, braucht Sprach Fox einen eigenen Claude-Schlüssel.</small>'+
    '<small>So bekommst du ihn: Auf console.anthropic.com anmelden, unter „API Keys“ einen Schlüssel erstellen und hier einfügen. Die Nutzung kostet ein paar Cent pro Unterrichtsstunde und wird über dein Anthropic-Konto abgerechnet.</small></div>'+
    '<div class="srow"><label class="lbl" for="keyIn">Claude-Schlüssel</label><input type="password" id="keyIn" placeholder="sk-ant-…" autocomplete="off" value="'+esc(set.key)+'"></div>'+
    '<button class="btn pri wide" data-act="savekey">Speichern</button><button class="btn wide" data-act="openurl" data-url="https://console.anthropic.com/settings/keys">Seite zum Schlüssel öffnen</button>');
}

/* ================= Vokabeln ================= */
function findVoc(lang,text){return vocab.filter(function(v){return v.lang===lang&&v.text.toLowerCase()===String(text).toLowerCase();})[0];}
function addVoc(o,quiet){
  if(!o.text)return false;
  if(findVoc(o.lang,o.text)){if(!quiet)toast('Steht schon in deinen Vokabeln.');return false;}
  vocab.push({id:uid(),lang:o.lang,text:o.text,de:o.de||'',translit:o.translit||'',box:0,due:Date.now(),added:Date.now(),ok:0,bad:0});
  saveVocab();if(!quiet)toast('Gemerkt: '+o.text);return true;
}
function dueList(lang){var n=Date.now();return vocab.filter(function(v){return v.due<=n&&(!lang||lang==='all'||v.lang===lang);});}
function updateBadge(){var n=dueList().length,b=$('#dueBadge');if(!b)return;b.hidden=!n;b.textContent=n>99?'99+':n;}

/* ================= Ähnlichkeit ================= */
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿¡?!.,;:'"«»„“”’`´\-–—。、！？，]/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var p=[],i,j;for(j=0;j<=n;j++)p[j]=j;for(i=1;i<=m;i++){var c=[i];for(j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function sim(a,b){a=norm(a);b=norm(b);var L=Math.max(a.length,b.length)||1;return 1-lev(a,b)/L;}
function bestSim(list,target,alt){var best=0,bestS='';(list||[]).forEach(function(s){var v=Math.max(sim(s,target),alt?sim(s,alt):0);if(v>best){best=v;bestS=s;}});return {score:best,heard:bestS};}

/* ================= Blatt ================= */
function openSheet(html){var s=$('#sheet');s.innerHTML='<div class="grip"></div>'+html;s.classList.add('open');$('#scrim').classList.add('open');s.scrollTop=0;}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').classList.remove('open');}
$('#scrim').addEventListener('click',closeSheet);

/* ================= Navigation ================= */
var tab='tr';
function go(t){
  tab=t;$$('#bnav button').forEach(function(b){if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  render();$('#main').scrollTop=0;
}
$('#bnav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.tab);});
function render(){
  if(tab==='tr')renderTr();else if(tab==='voc')renderVoc();else if(tab==='ueben')renderUeben();else renderLehrer();
}
function langSelect(id,val,list,extra){
  return '<select id="'+id+'">'+(extra||'')+list.map(function(k){return '<option value="'+k+'"'+(k===val?' selected':'')+'>'+esc(ln(k))+'</option>';}).join('')+'</select>';
}
var ALL=Object.keys(LANGS), FOREIGN=ALL.filter(function(k){return k!=='de';});

/* ================= Übersetzen ================= */
var trText='', trRes=null, trBusy=false;
function renderTr(){
  var targets=set.targets.filter(function(k){return LANGS[k];});
  var h='<div class="view">'+
   '<div class="box">'+
    '<div class="pair"><div><p class="lbl">Ich spreche</p>'+langSelect('src',set.src,ALL)+'</div>'+
    '<button class="btn" data-act="swap" aria-label="Sprachen tauschen" style="height:46px">'+ic('swap')+'</button></div>'+
    '<div class="speak"><button class="mic" id="bigMic" data-act="speak" aria-label="Sprechen">'+ic('mic')+'</button><span class="hint">Tippen und sprechen</span></div>'+
    '<textarea id="trIn" placeholder="… oder hier schreiben">'+esc(trText)+'</textarea>'+
    '<div><p class="lbl">Übersetzen in</p><div class="chips scroll" id="tgts">'+
      targets.map(function(k){return '<button class="chip" aria-pressed="true" data-act="tgl" data-k="'+k+'">'+esc(ln(k))+'</button>';}).join('')+
      '<button class="chip add" data-act="pickt">+ Sprache</button></div></div>'+
    '<button class="btn pri wide" data-act="translate"'+(trBusy?' disabled':'')+'>'+(trBusy?'<span class="spin"></span> Übersetze …':'Übersetzen')+'</button>'+
   '</div><div id="trOut" style="display:flex;flex-direction:column;gap:12px">'+trCards()+'</div></div>';
  $('#main').innerHTML=h;
}
function wordsHtml(text,lang){
  if(NOSPACE[lang])return esc(text);
  return String(text).split(/(\s+|[.,!?¿¡;:"«»()„“”]+)/).map(function(t){
    if(!t||/^(\s+|[.,!?¿¡;:"«»()„“”]+)$/.test(t))return esc(t);
    return '<span class="w" data-act="word" data-w="'+esc(t)+'" data-l="'+lang+'">'+esc(t)+'</span>';
  }).join('');
}
function trCards(){
  if(!trRes){
    return '<div class="empty"><svg viewBox="0 0 112 108"><use href="#fox"/></svg><span>Sag einen Satz, und der Fuchs übersetzt ihn in alle gewählten Sprachen. Tipp danach auf ein Wort, um es einzeln zu lernen.</span></div>';
  }
  return trRes.items.map(function(it,i){
    var saved=!!findVoc(it.lang,it.text);
    return '<article class="card">'+
      '<div class="top"><span>'+esc(ln(it.lang))+'</span></div>'+
      '<div class="tr" lang="'+esc(it.lang)+'">'+wordsHtml(it.text,it.lang)+'</div>'+
      (it.translit?'<div class="translit">'+esc(it.translit)+'</div>':'')+
      '<div class="row">'+
        '<button class="btn sm" data-act="say" data-i="'+i+'">'+ic('play')+'Anhören</button>'+
        '<button class="btn sm" data-act="say" data-slow="1" data-i="'+i+'">'+ic('slow')+'Langsam</button>'+
        '<button class="btn sm" data-act="repeat" data-i="'+i+'">'+ic('mic')+'Nachsprechen</button>'+
        '<button class="btn sm'+(saved?' grn':'')+'" data-act="keep" data-i="'+i+'">'+ic(saved?'check':'star')+(saved?'Gemerkt':'Merken')+'</button>'+
      '</div>'+
      (it.score?scoreHtml(it.score):'')+
      (it.tip?tipHtml(it.tip):'<div><button class="btn sm" data-act="explain" data-i="'+i+'"'+(it.tipBusy?' disabled':'')+'>'+(it.tipBusy?'<span class="spin"></span>':ic('bulb'))+'Lehrer erklärt</button></div>')+
    '</article>';
  }).join('');
}
function scoreHtml(s){
  var p=Math.round(s.score*100), cls=p>=85?'ok':p>=60?'mid':'no';
  var msg=p>=90?'Super ausgesprochen!':p>=75?'Gut, fast perfekt.':p>=55?'Schon nah dran. Hör es dir nochmal langsam an.':'Das klang noch anders. Hör genau hin und versuch es nochmal.';
  return '<div class="score '+cls+'"><b>'+p+' %</b>'+msg+(s.heard?'<br><small class="hint">Verstanden: „'+esc(s.heard)+'“</small>':'')+'</div>';
}
function tipHtml(t){
  return '<div class="tip">'+(t.pron?'<div><b class="h">Aussprache:</b> '+esc(t.pron)+'</div>':'')+
    (t.words&&t.words.length?'<div class="words">'+t.words.map(function(w){return '<b>'+esc(w.w)+'</b><span>'+esc(w.m)+'</span>';}).join('')+'</div>':'')+
    (t.tip?'<div><b class="h">Lehrer-Tipp:</b> '+esc(t.tip)+'</div>':'')+'</div>';
}
async function doTranslate(){
  var ta=$('#trIn');trText=(ta?ta.value:trText).trim();
  if(!trText){toast('Sag oder schreib zuerst etwas.');return;}
  var targets=set.targets.filter(function(k){return k!==set.src&&LANGS[k];});
  if(!targets.length){toast('Wähle mindestens eine andere Sprache.');return;}
  trBusy=true;renderTr();
  try{
    var src=set.src;
    var items=await Promise.all(targets.map(function(k){return translate(trText,src,k).then(function(r){return {lang:k,text:r.text,translit:r.translit};});}));
    var de=trText;
    if(src!=='de'){var hit=items.filter(function(x){return x.lang==='de';})[0];de=hit?hit.text:(await translate(trText,src,'de')).text;}

function streak(){var s=load('sf-streak',{n:0,d:''});var today=new Date().toDateString(),y=new Date(Date.now()-DAY).toDateString();if(s.d!==today&&s.d!==y)s.n=0;return s;}
function bumpStreak(){var s=load('sf-streak',{n:0,d:''}),today=new Date().toDateString(),y=new Date(Date.now()-DAY).toDateString();if(s.d===today)return;s.n=(s.d===y?s.n:0)+1;s.d=today;save('sf-streak',s);}

function startSession(pool){
  if(!pool){
    var all=vocab.filter(function(v){return uLang==='all'||v.lang===uLang;});
    var n=Date.now();
    pool=all.filter(function(v){return v.due<=n;}).sort(function(a,b){return a.box-b.box||a.due-b.due;});
    if(pool.length<10){var rest=all.filter(function(v){return pool.indexOf(v)<0;}).sort(function(){return Math.random()-.5;});pool=pool.concat(rest);}
  }
  pool=pool.slice(0,10).sort(function(){return Math.random()-.5;});
  if(!pool.length){toast('Keine Vokabeln für diese Auswahl.');return;}
  ses={mode:uMode,items:pool,i:0,right:0,state:'ask',answer:'',result:null};
  go('ueben');
}

    }
  }else{
    var r=ses.result;
    h+='<div class="res '+(r.ok?'ok':'no')+'"><b>'+r.title+'</b>'+
      (ses.mode!=='speak'?'<div class="big" lang="'+esc(it.lang)+'">'+esc(it.text)+'</div>'+(it.translit?'<i class="hint">'+esc(it.translit)+'</i>':''):'')+
      (r.heard?'<small class="hint">'+(ses.mode==='speak'?'Verstanden: ':'Deine Antwort: ')+'„'+esc(r.heard)+'“</small>':'')+
      (ses.mode!=='write'?'<small class="hint">Bedeutung: '+esc(it.de)+'</small>':'')+

function judge(ok,heard,title){
  var it=ses.items[ses.i];
  ses.state='done';ses.result={ok:ok,heard:heard,title:title};
  if(ok)ses.right++;
  if(vocab.indexOf(it)>=0){
    if(ses.mode==='write'){it.box=ok?Math.min(5,it.box+1):0;it.due=Date.now()+INTERVALS[it.box]*DAY;}
    if(ok)it.ok=(it.ok||0)+1;else it.bad=(it.bad||0)+1;
    saveVocab();
  }
  renderCard();
  if(ok&&ses.mode==='write')say(it.text,it.lang);
}
function checkAns(gaveUp){
  var it=ses.items[ses.i],a=gaveUp?'':($('#ans').value||'').trim();
  if(!gaveUp&&!a){toast('Schreib oder sprich zuerst eine Antwort.');return;}
  var s=gaveUp?0:Math.max(sim(a,it.text),it.translit?sim(a,it.translit):0);
  var lim=ses.mode==='listen'?0.8:0.85;
  var ok=s>=lim;
  judge(ok,a,ok?(s>=0.99?'Perfekt!':'Richtig! Kleine Abweichung:'):(gaveUp?'Das ist die Lösung:':'Noch nicht ganz. Richtig ist:'));
}

    (r.words&&r.words.length?'<div class="words">'+r.words.map(function(w,j){return '<b>'+esc(w.w)+'</b><span>'+esc(w.m)+' <button class="btn sm" style="min-height:28px;padding:2px 9px" data-act="keepcw" data-i="'+i+'" data-j="'+j+'">+</button></span>';}).join('')+'</div>':'')+
    '<div class="row"><button class="btn sm" data-act="saycm" data-i="'+i+'">'+ic('play')+'Anhören</button></div></div>';
}
async function openLesson(i){
  lesson=LESSONS[i];lView='lesson';lessonRows=null;lessonBusy=true;renderLehrer();
  var lang=set.learn;
  try{
    var rows=[];
    for(var k=0;k<lesson.p.length;k+=5){
      var part=await Promise.all(lesson.p.slice(k,k+5).map(function(p){return translate(p,'de',lang).then(function(r){return {de:p,text:r.text,translit:r.translit};});}));
      rows=rows.concat(part);
    }
    if(lang!==set.learn||lView!=='lesson')return;
    lessonRows=rows;
  }catch(e){toast('Die Lektion konnte nicht geladen werden. Prüf deine Internetverbindung.',5000);lView='home';}
  lessonBusy=false;renderLehrer();
}
async function sendChat(text){
  text=String(text||'').trim();if(!text||chatBusy)return;
  if(!hasKey()){keySheet();return;}
  chat.push({role:'user',content:text});chatBusy=true;renderLehrer();
  var L=ln(set.learn);
  var sys='Du bist ein geduldiger, freundlicher '+L+'-Lehrer für einen deutschsprachigen Schüler auf Niveau '+set.level+'. Führe eine kleine Unterrichtsstunde als Gespräch: antworte auf '+L+' in einfachen, kurzen Sätzen passend zu '+set.level+', und stelle am Ende meist eine Frage, damit der Schüler weiter übt. Wenn der Schüler auf '+L+' schreibt und Fehler macht, korrigiere sie. Antworte NUR mit JSON: {"reply":"Antwort auf '+L+'","reply_de":"deutsche Übersetzung","correction":null oder {"original":"Satz des Schülers","corrected":"korrigiert","explanation":"kurz auf Deutsch"},"words":[{"w":"neues Wort auf '+L+'","m":"deutsch"}]} mit höchstens 4 words.';
  var msgs=chat.slice(-14).map(function(m){return {role:m.role,content:m.role==='user'?m.content:JSON.stringify({reply:m.data&&m.data.reply})};});
  while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  try{
    var r=await askClaude(sys,msgs,900);
    chat.push({role:'assistant',data:r});chatBusy=false;renderLehrer();
    if(set.autoSay&&r.reply)say(r.reply,set.learn);
  }catch(e){chat.pop();chatBusy=false;renderLehrer();claudeErr(e);}
}

/* ================= Einstellungen ================= */
var appVer=null, upd=null, UPL=false;
async function loadVer(){var P=plug('Updater');if(!P||appVer)return;try{var i=await P.info();appVer={code:Number(i.versionCode),name:String(i.versionName||'')};}catch(e){}}
async function settingsSheet(){
  await loadVer();
  openSheet('<h3>Einstellungen</h3>'+
    '<div class="srow"><b>Sprechtempo</b><input type="range" id="rate" min="0.6" max="1.3" step="0.05" value="'+set.rate+'"><small>Wie schnell der Fuchs vorliest</small></div>'+
    '<div class="srow line"><div><b>Automatisch vorlesen</b><br><small>Übersetzungen und Lehrer-Antworten sofort anhören</small></div><input type="checkbox" class="sw" id="autoSay"'+(set.autoSay?' checked':'')+' aria-label="Automatisch vorlesen"></div>'+
    '<button class="srow" style="border:0;text-align:left" data-act="keysheet"><b>Lehrer (Claude-Schlüssel)</b><small>'+(hasKey()?'Eingetragen · tippen zum Ändern':'Nicht eingetragen · tippen zum Freischalten')+'</small></button>'+
    (isNative()?'<button class="srow" style="border:0;text-align:left" data-act="ttstest"><b>Vorlesen testen</b><small>Wenn beim Anhören nichts kommt</small></button>':'')+
    (isNative()?'<button class="srow" style="border:0;text-align:left" data-act="upd"><b>App-Update</b><small>'+(appVer?'Version '+appVer.code+' · ':'')+'Tippen zum Prüfen'+(upd?' · Neu: '+upd.ver:'')+'</small></button>'+
    '<div class="srow line"><div><b>Updates automatisch suchen</b><br><small>Die Installation bestätigst du selbst</small></div><input type="checkbox" class="sw" id="autoUpd"'+(set.autoUpd?' checked':'')+' aria-label="Updates automatisch suchen"></div>':'')+
    '<div class="srow line"><div><b>Vokabelheft</b><br><small>'+vocab.length+' Einträge</small></div><button class="btn sm" data-act="clearvoc">Leeren</button></div>'+
    '<p class="hint" style="text-align:center">Sprach Fox · Design by <b style="color:var(--accent)">Mr.Fox</b></p>');
  $('#rate').addEventListener('change',function(e){set.rate=parseFloat(e.target.value);saveSet();say('Hallo, ich bin dein Sprach Fox.','de');});
  $('#autoSay').addEventListener('change',function(e){set.autoSay=e.target.checked;saveSet();});
  var au=$('#autoUpd');if(au)au.addEventListener('change',function(e){set.autoUpd=e.target.checked;saveSet();});
}

/* ================= App-Update über GitHub ================= */
async function checkUpdate(manual){
  var P=plug('Updater');if(!P)return;
  await loadVer();
  if(REPO.indexOf('__')===0){if(manual)toast('Diese Version kennt ihr GitHub-Repository nicht.');return;}
  if(manual)toast('Suche nach Updates …');
  try{
    var r=await fetchT('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{'Accept':'application/vnd.github+json'}},12000);
    if(!r.ok)throw new Error('GitHub '+r.status);
    var j=await r.json(),m=String(j.tag_name||'').match(/(\d+)\s*$/),ver=m?parseInt(m[1],10):0;
    var asset=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name);})[0];
    if(!asset)throw new Error('keine APK im Release');
    if(appVer&&ver>appVer.code){
      upd={ver:ver,url:asset.browser_download_url,size:asset.size,done:false,notes:String(j.body||'').split(/\r?\n/).map(function(l){return l.replace(/^[\s*•-]+/,'').trim();}).filter(function(l){return l&&!/^(co-authored-by|claude-session)/i.test(l)&&!/^https?:/.test(l);})};
      updateSheet();
    }else if(manual)toast('Du hast die neueste Version ('+(appVer?appVer.code:'?')+').');
  }catch(e){if(manual)toast('Update-Prüfung fehlgeschlagen: '+String((e&&e.message)||e).slice(0,100));}
}
function updateSheet(){
  var mb=upd.size?' · '+(upd.size/1048576).toFixed(1).replace('.',',')+' MB':'';
  openSheet('<h3>Neues Update bereit</h3><div class="srow"><b>Version '+upd.ver+'</b><small>Installiert: '+(appVer?appVer.code:'?')+mb+'</small></div>'+
    '<div class="srow"><b>Was ist neu</b>'+(upd.notes.length?'<ul style="margin:0;padding-left:20px">'+upd.notes.slice(0,12).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>':'<small>Kleine Verbesserungen und Fehlerbehebungen</small>')+'</div>'+
    '<button class="btn pri wide" data-act="updgo">Jetzt aktualisieren</button><button class="btn wide" data-act="close">Später</button>');
}
async function doUpdate(){
  var P=plug('Updater');if(!P||!upd)return;
  if(!UPL){UPL=true;
    try{P.addListener('progress',function(e){var a=$('#updP'),b=$('#updB'),p=(e&&e.percent)||0;if(a)a.textContent='Lade … '+p+' %';if(b)b.style.width=p+'%';});}catch(x){}
    try{P.addListener('installResult',function(e){var st=e&&e.status,m=String((e&&e.message)||'');if(st===0)return;if(st===3){toast('Installation abgebrochen.');return;}
      var t=(st===7||st===5||/INCOMPATIBLE|signature|CONFLICT/i.test(m))?'Die Signatur passt nicht zur installierten App. Deinstalliere Sprach Fox einmal und installiere die neueste Version von GitHub von Hand.':st===6?'Auf dem Handy ist zu wenig Speicher frei.':'Android hat die Installation abgelehnt.';
      openSheet('<h3>Installation fehlgeschlagen</h3><div class="srow"><small style="color:var(--fg)">'+esc(t)+'</small><small>Technisch: '+esc(m.slice(0,160)||('Code '+st))+'</small></div><button class="btn wide" data-act="close">OK</button>');});}catch(x){}
  }
  try{
    if(!upd.done){
      openSheet('<h3>Update wird geladen</h3><div class="srow"><b id="updP">Lade … 0 %</b><div class="prog"><i id="updB" style="width:0"></i></div></div>');
      await P.download({url:upd.url});upd.done=true;
    }
    closeSheet();await P.install();
  }catch(e){var m=String((e&&e.message)||e);closeSheet();
    if(/permission/i.test(m))toast('Erlaube Sprach Fox in den Einstellungen „Apps installieren“ und tippe danach nochmal auf App-Update.',6000);
    else toast('Update fehlgeschlagen: '+m.slice(0,200),6000);}
}

/* ================= Klicks ================= */
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='src'){set.src=t.value;saveSet();}
  else if(t.id==='learnSel'){set.learn=t.value;saveSet();chat=[];if(lView==='lesson'&&lesson){openLesson(LESSONS.indexOf(lesson));}else renderLehrer();}
  else if(t.id==='lvlSel'){set.level=t.value;saveSet();}
});
document.addEventListener('input',function(e){if(e.target.id==='trIn')trText=e.target.value;if(e.target.id==='ans'&&ses)ses.answer=e.target.value;});
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act, i=b.dataset.i!=null?+b.dataset.i:-1;
  switch(a){
    case 'settings':settingsSheet();break;
    case 'close':closeSheet();break;
    case 'tab':go(b.dataset.t);break;
    case 'openurl':{var P=plug('Updater');if(P)P.openUrl({url:b.dataset.url,fallback:''}).catch(function(){toast('Adresse: '+b.dataset.url,6000);});else window.open(b.dataset.url,'_blank');break;}
    case 'savekey':set.key=($('#keyIn').value||'').trim();saveSet();closeSheet();toast(hasKey()?'Lehrer freigeschaltet.':'Schlüssel entfernt.');render();break;
    case 'keysheet':keySheet();break;
    case 'ttsinstall':{var T=plug('Tts');closeSheet();if(T)T.install().catch(function(){toast('Einstellungen lassen sich nicht öffnen.');});break;}
    case 'ttstest':ttsTest();break;
    case 'ttsprobe':ttsWarned=false;say(b.dataset.l==='de'?'Hallo, ich bin dein Sprach Fox.':'Hello, I am your language fox.',b.dataset.l);break;
    case 'ttslouder':{var T2=plug('Tts');if(T2)T2.louder().then(ttsTest).catch(function(){});break;}
    case 'ttsgoogle':{var T3=plug('Tts');if(T3)T3.getGoogle().catch(function(){toast('Suche im Play Store nach „Sprachausgabe von Google“.',6000);});break;}
    case 'ttssettings':{var T4=plug('Tts');if(T4)T4.settings().catch(function(){toast('Einstellungen lassen sich nicht öffnen.');});break;}
    case 'ttsrestart':{var T5=plug('Tts');if(T5){await T5.restart();toast('Sprachausgabe neu verbunden.');setTimeout(ttsTest,1500);}break;}
    case 'upd':closeSheet();checkUpdate(true);break;
    case 'updgo':doUpdate();break;
    case 'clearvoc':openSheet('<h3>Vokabelheft leeren?</h3><div class="srow"><small style="color:var(--fg)">Alle '+vocab.length+' Vokabeln und dein Lernstand werden gelöscht.</small></div><button class="btn wide" style="background:var(--bad);color:#fff" data-act="clearyes">Ja, alles löschen</button><button class="btn wide" data-act="close">Abbrechen</button>');break;
    case 'clearyes':vocab=[];saveVocab();closeSheet();render();toast('Vokabelheft geleert.');break;
    /* Übersetzen */
    case 'speak':speakInput();break;
    case 'translate':doTranslate();break;
    case 'swap':{var first=set.targets[0];if(!first)break;var old=set.src;set.src=first;set.targets[0]=old;saveSet();
      if(trRes&&trRes.items[0]){trText=trRes.items[0].text;}trRes=null;renderTr();break;}
    case 'tgl':{var k=b.dataset.k;set.targets=set.targets.filter(function(x){return x!==k;});saveSet();renderTr();break;}
    case 'pickt':pickTargets();break;
    case 'tglsheet':{var k2=b.dataset.k,on=set.targets.indexOf(k2)>=0;if(on)set.targets=set.targets.filter(function(x){return x!==k2;});else set.targets.push(k2);saveSet();b.setAttribute('aria-pressed',!on);break;}
    case 'closeTr':closeSheet();renderTr();break;
    case 'say':{var it=trRes.items[i];say(it.text,it.lang,!!b.dataset.slow);break;}
    case 'repeat':repeatAfter(trRes.items[i],renderTr);break;
    case 'keep':{var it2=trRes.items[i];if(findVoc(it2.lang,it2.text))break;addVoc({lang:it2.lang,text:it2.text,de:trRes.de,translit:it2.translit});renderTr();break;}
    case 'explain':explain(i);break;
    case 'word':wordSheet(b.dataset.w,b.dataset.l);break;
    case 'sayw':say(b.dataset.w,b.dataset.l);break;
    case 'keepw':if(addVoc({lang:b.dataset.l,text:b.dataset.w,de:b.dataset.de})){b.className='btn grn';b.innerHTML=ic('check')+'Gemerkt';}break;
    /* Vokabeln */
    case 'vf':vocFilter=b.dataset.k;renderVoc();break;
    case 'sayv':{var v=vocab.filter(function(x){return x.id===b.dataset.id;})[0];if(v)say(v.text,v.lang);break;}
    case 'delv':vocab=vocab.filter(function(x){return x.id!==b.dataset.id;});saveVocab();renderVoc();break;
    /* Üben */
    case 'mode':uMode=b.dataset.k;renderUeben();break;
    case 'ul':uLang=b.dataset.k;renderUeben();break;
    case 'start':startSession();break;
    case 'again':ses=null;startSession();break;
    case 'quit':ses=null;renderUeben();break;
    case 'sayq':{var q=ses.items[ses.i];say(q.text,q.lang,!!b.dataset.slow);break;}
    case 'check':checkAns(false);break;
    case 'giveup':checkAns(true);break;
    case 'skip':judge(false,'','Übersprungen');break;
    case 'qmic':{var it3=ses.items[ses.i];micBusy(b,true);try{var m=await listen(it3.lang,'Antwort auf '+ln(it3.lang));micBusy(b,false);if(m&&m.length){var best=bestSim(m,it3.text,it3.translit);$('#ans').value=best.heard||m[0];ses.answer=$('#ans').value;checkAns(false);}}catch(err){micBusy(b,false);toast(String((err&&err.message)||err),5000);}break;}
    case 'qspeak':{var it4=ses.items[ses.i];micBusy(b,true);try{var m2=await listen(it4.lang,'Sprich nach: '+it4.text);micBusy(b,false);if(!m2||!m2.length){toast('Ich habe nichts gehört.');break;}var s=bestSim(m2,it4.text,it4.translit),p=Math.round(s.score*100);judge(p>=70,s.heard,p+' % · '+(p>=90?'Super ausgesprochen!':p>=70?'Gut verständlich!':'Das klang noch anders.'));}catch(err){micBusy(b,false);toast(String((err&&err.message)||err),5000);}break;}
    case 'ihad':{ses.right++;ses.result.ok=true;var it5=ses.items[ses.i];if(vocab.indexOf(it5)>=0&&ses.mode==='write'){it5.box=1;it5.due=Date.now()+INTERVALS[1]*DAY;saveVocab();}ses.i++;ses.state='ask';ses.answer='';ses.played=false;renderCard();break;}
    case 'next':ses.i++;ses.state='ask';ses.answer='';ses.played=false;renderCard();$('#main').scrollTop=0;break;
    case 'why':{var it6=ses.items[ses.i];b.disabled=true;b.innerHTML='<span class="spin"></span>';
      try{var r=await askClaude('Du bist ein freundlicher Sprachlehrer für deutschsprachige Schüler. Antworte nur mit JSON.',[{role:'user',content:'Gesucht auf '+ln(it6.lang)+': "'+it6.text+'" (Bedeutung: "'+it6.de+'"). Der Schüler schrieb: "'+ses.result.heard+'". Erkläre kurz und ermutigend auf Deutsch, was falsch war und wie man es sich merkt. Format: {"explanation":"höchstens 3 Sätze"}'}],400);
        $('#whyBox').innerHTML='<div class="tip"><div><b class="h">Lehrer:</b> '+esc(r.explanation)+'</div></div>';b.remove();}
      catch(err){b.disabled=false;b.innerHTML=ic('bulb')+'Warum falsch?';claudeErr(err);}break;}
    /* Lehrer */
    case 'lesson':openLesson(i);break;
    case 'lhome':lView='home';renderLehrer();break;
    case 'sayl':say(lessonRows[i].text,set.learn);break;
    case 'keepl':{var r2=lessonRows[i];if(!findVoc(set.learn,r2.text)){addVoc({lang:set.learn,text:r2.text,de:r2.de,translit:r2.translit});renderLehrer();}break;}
    case 'lsaveall':{var n=0;lessonRows.forEach(function(r){if(addVoc({lang:set.learn,text:r.text,de:r.de,translit:r.translit},true))n++;});toast(n?n+' Sätze ins Vokabelheft gelegt.':'Alles schon im Vokabelheft.');renderLehrer();break;}
    case 'lpractice':{lessonRows.forEach(function(r){addVoc({lang:set.learn,text:r.text,de:r.de,translit:r.translit},true);});var pool=lessonRows.map(function(r){return findVoc(set.learn,r.text);}).filter(Boolean);uMode='write';startSession(pool);break;}
    case 'chat':lView='chat';renderLehrer();if(!hasKey())keySheet();break;
    case 'chatreset':chat=[];renderLehrer();break;
    case 'starter':sendChat(b.textContent);break;
    case 'chatsend':sendChat($('#chatIn').value);break;
    case 'chatmic':{micBusy(b,true);try{var m3=await listen(set.learn,'Sprich auf '+ln(set.learn)+' oder Deutsch');micBusy(b,false);if(m3&&m3[0]){$('#chatIn').value=m3[0];}}catch(err){micBusy(b,false);toast(String((err&&err.message)||err),5000);}break;}
    case 'saycm':{var d=chat[i]&&chat[i].data;if(d)say(d.reply,set.learn);break;}
    case 'keepcw':{var d2=chat[i]&&chat[i].data,w=d2&&d2.words[+b.dataset.j];if(w&&addVoc({lang:set.learn,text:w.w,de:w.m})){b.textContent='✓';b.disabled=true;}break;}
  }
});

/* ================= Start ================= */
updateBadge();render();
setTimeout(function(){$('#splash').classList.add('hide');},900);
if(isNative()&&set.autoUpd){
  var lastU=0;try{lastU=Number(localStorage.getItem('sf-upd-t')||0);}catch(e){}
  if(Date.now()-lastU>6*3600e3){try{localStorage.setItem('sf-upd-t',String(Date.now()));}catch(e){}setTimeout(function(){checkUpdate(false);},3000);}
}
